version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: read-it-later-db
    environment:
      POSTGRES_USER: readitlater
      POSTGRES_PASSWORD: dev_password_change_in_production
      POSTGRES_DB: readitlater
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U readitlater"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: read-it-later-backend
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://readitlater:dev_password_change_in_production@postgres:5432/readitlater
      JWT_SECRET: dev_jwt_secret_change_in_production
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    command: npm run dev

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    container_name: read-it-later-web
    environment:
      VITE_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev

volumes:
  postgres-data:
